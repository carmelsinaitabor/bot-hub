name: Reusable 5AM Health Check (SGT)
on:
  workflow_call:
    inputs:
      issue_search_title:
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run guardrails and workflow health check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SEARCH_TITLE: ${{ inputs.issue_search_title }}
        run: |
          set -e
          G_OK=1
          if [ -f scripts/check_bot_guardrails.py ]; then
            python3 scripts/check_bot_guardrails.py > /tmp/guard.out 2>&1 || G_OK=0
          else
            python3 -m compileall -q . > /tmp/guard.out 2>&1 || G_OK=0
          fi
          G_MSG=$(tr "\n" " " < /tmp/guard.out | sed "s/  */ /g")
          python3 - << 'PY'
          import json, os, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now_sgt = datetime.now(ZoneInfo("Asia/Singapore")).strftime("%Y-%m-%d %H:%M SGT")
          url = f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows"
          req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "bot-health-5am",
          })
          wfs = []
          out_note = ""
          try:
              wfs = json.loads(urllib.request.urlopen(req, timeout=20).read().decode()).get("workflows", [])
          except Exception as exc:
              out_note = f"  - (Workflows API unavailable: {exc})"
          g_ok = os.environ.get("G_OK", "1") == "1"
          out = [f"### 5AM Bot Health Report ({now_sgt})", "", f"- Guardrails: {'PASS' if g_ok else 'FAIL'} - {os.environ.get('G_MSG', '')}", "- Workflows:"]
          if not wfs and out_note:
              out.append(out_note)
          for w in sorted(wfs, key=lambda x: x.get("path", "")):
              out.append(f"  - {w.get('path')} ({w.get('state')})")
          open("/tmp/rep.md", "w", encoding="utf-8").write("\n".join(out) + "\n")
          PY
          cat /tmp/rep.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SEARCH_TITLE" ]; then
            ISSUE_NUM=$(gh issue list --state open --search "$SEARCH_TITLE in:title" --json number --jq ".[0].number // empty")
            [ -n "$ISSUE_NUM" ] && gh issue comment "$ISSUE_NUM" --body-file /tmp/rep.md || true
          fi
          [ "$G_OK" != "1" ] && exit 1 || true
